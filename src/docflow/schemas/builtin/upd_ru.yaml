slug: upd_ru
version: 1
title: Универсальный передаточный документ (УПД)
description: УПД (счёт-фактура и передаточный документ) с таблицей товаров, статусом и участниками сделки.
fields:
  - name: number
    title: Номер
    type: string
    required: true
    description: "Номер УПД строкой, как написан (из шапки «Счёт-фактура № … от …»)."
  - name: issued
    title: Дата
    type: date
    required: true
    description: "Дата УПД (после «от»). Месяц прописью переведи в число. null, если даты нет."
    rules:
      - {kind: date_not_future}
  - name: status
    title: Статус УПД
    type: enum
    values: ["1", "2"]
    description: "Статус УПД из левого верхнего угла: «1» — счёт-фактура и передаточный документ, «2» — только передаточный документ. null, если не виден."
  - name: supplier
    title: Поставщик
    type: string
    description: "Продавец: наименование как написано, с формой собственности."
  - name: supplier_inn
    title: ИНН поставщика
    type: string
    description: "ИНН продавца из строки «ИНН/КПП» — цифры до косой черты: 10 или 12 цифр без пробелов."
    rules:
      - {kind: inn}
  - name: supplier_kpp
    title: КПП поставщика
    type: string
    description: "КПП продавца: 9 цифр после косой черты в строке «ИНН/КПП». null у ИП."
    rules:
      - {kind: kpp}
  - name: shipper
    title: Грузоотправитель
    type: string
    description: "Грузоотправитель: наименование и адрес как написаны. Если написано «он же» — верни «он же». null, если не указан."
  - name: consignee
    title: Грузополучатель
    type: string
    description: "Грузополучатель: наименование и адрес как написаны. Если «он же» — верни «он же». null, если не указан."
  - name: buyer
    title: Покупатель
    type: string
    description: "Покупатель: наименование как написано."
  - name: buyer_inn
    title: ИНН покупателя
    type: string
    description: "ИНН покупателя (цифры до косой черты в «ИНН/КПП»): 10 или 12 цифр."
    rules:
      - {kind: inn}
  - name: buyer_kpp
    title: КПП покупателя
    type: string
    description: "КПП покупателя: 9 цифр после косой черты. null у ИП."
    rules:
      - {kind: kpp}
  - name: bik
    title: БИК банка поставщика
    type: string
    description: "БИК банка продавца, если указан в реквизитах: 9 цифр. null, если банковских реквизитов нет."
    rules:
      - {kind: bik}
  - name: account
    title: Расчётный счёт поставщика
    type: string
    description: "Расчётный счёт продавца (р/с), 20 цифр без пробелов. null, если реквизитов нет."
  - name: items
    title: Позиции
    type: table
    required: true
    description: "Все строки таблицы товаров (работ, услуг) по порядку, без строки «Всего к оплате»."
    columns:
      - name: name
        title: Наименование
        type: string
        description: "Наименование товара (графа 1) целиком, как написано."
      - name: unit
        title: Ед. изм.
        type: string
        description: "Единица измерения (графа 2/2а): «шт», «кг». null, если нет."
      - name: qty
        title: Кол-во
        type: number
        description: "Количество (графа 3). «2,5» = 2.5. null, если не указано."
      - name: price
        title: Цена
        type: number
        description: "Цена за единицу без НДС (графа 4) в рублях числом. null, если нет."
      - name: amount
        title: Сумма без НДС
        type: number
        description: "Стоимость без налога, всего (графа 5), как напечатана. null, если нет."
      - name: vat_amount
        title: Сумма НДС
        type: number
        description: "Сумма налога (графа 8) как напечатана. null при «без НДС»."
      - name: amount_with_vat
        title: Сумма с НДС
        type: number
        description: "Стоимость с налогом, всего (графа 9), как напечатана. null, если нет."
  - name: total
    title: Всего с НДС
    type: number
    required: true
    description: "«Всего к оплате»: стоимость с налогом (графа 9) итоговой строки, ТАК, КАК НАПЕЧАТАНО. Не пересчитывай."
  - name: vat
    title: НДС
    type: number
    description: "Сумма НДС (графа 8) итоговой строки «Всего к оплате». null, если «без НДС»."
rules:
  - kind: table_sum_equals
    params: {table: items, column: amount_with_vat, total: total, tolerance: 0.01}
  - kind: table_row_product
    params: {table: items, qty: qty, price: price, amount: amount}

# Полный стек DocFlow: docker compose up -d --build
# Порты на хосте: API 8000 (0.0.0.0 — для dev), Postgres 55432 (5432 часто занят локальным Postgres), Redis 6379,
# S3 8333. Хранилища опубликованы только на 127.0.0.1: в Redis лежат задачи arq в pickle — кто может писать
# в Redis, тот исполняет код в воркере.
# Секреты — из окружения хоста или .env рядом с этим файлом (образец — .env.example); значения по умолчанию
# годятся только для локальной разработки.
x-app-env: &app-env
  DOCFLOW_DATABASE_URL: postgresql+asyncpg://${DOCFLOW_PG_USER:-docflow}:${DOCFLOW_PG_PASSWORD:-docflow}@postgres:5432/docflow
  # пароль подставляется в URL как есть: в нём не должно быть символов, которые надо экранировать (@ : / %)
  DOCFLOW_REDIS_URL: redis://:${DOCFLOW_REDIS_PASSWORD:-docflow-dev}@redis:6379/0
  DOCFLOW_BLOB_BACKEND: s3
  DOCFLOW_S3_ENDPOINT: http://s3:8333
  DOCFLOW_S3_BUCKET: docflow
  DOCFLOW_S3_ACCESS_KEY: ${DOCFLOW_S3_ACCESS_KEY:-docflow}
  DOCFLOW_S3_SECRET_KEY: ${DOCFLOW_S3_SECRET_KEY:-docflow-secret}
  DOCFLOW_PUBLIC_BASE_URL: ${DOCFLOW_PUBLIC_BASE_URL:-http://localhost:8000}
  DOCFLOW_ANTHROPIC_MODEL: ${DOCFLOW_ANTHROPIC_MODEL:-claude-opus-5-5}
  # ключ берётся с хоста; без него работают только fake-экстрактор и Ollama
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # локальный режим (152-ФЗ): Ollama на хосте; в проде — адрес GPU-сервера внутри периметра клиента
  DOCFLOW_OLLAMA_URL: ${DOCFLOW_OLLAMA_URL:-http://host.docker.internal:11434}
  DOCFLOW_OLLAMA_MODEL: ${DOCFLOW_OLLAMA_MODEL:-qwen3-vl:30b-a3b-instruct}
  # общий секрет с сайтом: по нему API доверяет X-Client-IP (пусто = не доверять)
  DOCFLOW_INTERNAL_TOKEN: ${DOCFLOW_INTERNAL_TOKEN:-docflow-internal-dev}

services:
  postgres:
    image: postgres:16
    environment:
      # пароль применяется только при первой инициализации тома pgdata; для смены — ALTER USER или новый том
      POSTGRES_USER: ${DOCFLOW_PG_USER:-docflow}
      POSTGRES_PASSWORD: ${DOCFLOW_PG_PASSWORD:-docflow}
      POSTGRES_DB: docflow
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d docflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # пароль — вторая линия обороны к привязке на 127.0.0.1; AOF — чтобы рестарт Redis не терял очередь
    command: ["redis-server", "--requirepass", "${DOCFLOW_REDIS_PASSWORD:-docflow-dev}", "--appendonly", "yes"]
    environment:
      # redis-cli берёт пароль отсюда: healthcheck без пароля в аргументах
      REDISCLI_AUTH: ${DOCFLOW_REDIS_PASSWORD:-docflow-dev}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-совместимое хранилище (SeaweedFS). Файл identities не умеет подставлять переменные окружения,
  # поэтому пишем его при старте из DOCFLOW_S3_* и передаём управление штатному entrypoint образа.
  # Ключи — только буквы/цифры/-/_: они вставляются в JSON без экранирования.
  s3:
    image: chrislusf/seaweedfs:4.50
    environment:
      S3_ACCESS_KEY: ${DOCFLOW_S3_ACCESS_KEY:-docflow}
      S3_SECRET_KEY: ${DOCFLOW_S3_SECRET_KEY:-docflow-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (umask 077; printf '{"identities":[{"name":"docflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json)
        chown seaweed /tmp/s3.json 2>/dev/null || true
        exec /entrypoint.sh server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # одноразовый: миграции и встроенные схемы, потом api/worker стартуют
  migrate:
    build: {context: ., dockerfile: docker/Dockerfile, target: api}
    image: docflow-api
    command: ["sh", "-c", "alembic upgrade head && docflow seed-schemas"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    image: docflow-api
    build: {context: ., dockerfile: docker/Dockerfile, target: api}
    environment: *app-env
    # API открыт на всех интерфейсах ради dev (телефон в той же сети); в проде — за прокси, см. README
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    image: docflow-worker
    build: {context: ., dockerfile: docker/Dockerfile, target: worker}
    environment: *app-env
    # host.docker.internal на Linux-хостах (в Docker Desktop есть и так)
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      # arq --check: свежий ли ключ здоровья, который воркер пишет в Redis раз в health_check_interval
      test: ["CMD", "arq", "--check", "docflow.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # сайт (Next.js): ходит в API по внутренней сети, браузеру токены не отдаёт
  web:
    build: {context: ./web}
    image: docflow-web
    environment:
      DOCFLOW_API_URL: http://api:8000
      DOCFLOW_INTERNAL_TOKEN: ${DOCFLOW_INTERNAL_TOKEN:-docflow-internal-dev}
      COOKIE_SECURE: "false"  # dev по http; в проде за https убрать
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  # интеграционные тесты внутри сети стека (tesseract есть только в образе воркера):
  #   docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: docflow-test
    build: {context: ., dockerfile: docker/Dockerfile, target: test}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  s3data:

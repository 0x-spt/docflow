name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run pytest -m "not integration and not e2e"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # SeaweedFS нельзя запустить как service-контейнер (нужны команда и файл ключей), поэтому стартуем шагом ниже
    env:
      DOCFLOW_DATABASE_URL: postgresql+asyncpg://docflow:docflow@localhost:5432/docflow
      # в CI Redis без пароля: раннер одноразовый, порт не виден снаружи
      DOCFLOW_REDIS_URL: redis://localhost:6379/0
      DOCFLOW_S3_ENDPOINT: http://localhost:8333
      DOCFLOW_S3_ACCESS_KEY: docflow
      DOCFLOW_S3_SECRET_KEY: docflow-secret
    steps:
      - uses: actions/checkout@v4
      # тот же образ и тот же способ задать ключи, что в docker-compose.yml: файл identities из окружения
      - name: SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 \
            -e S3_ACCESS_KEY="$DOCFLOW_S3_ACCESS_KEY" -e S3_SECRET_KEY="$DOCFLOW_S3_SECRET_KEY" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.50 -c '
              (umask 077; printf "{\"identities\":[{\"name\":\"docflow\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/s3.json)
              chown seaweed /tmp/s3.json 2>/dev/null || true
              exec /entrypoint.sh server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json'
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8333/healthz >/dev/null && exit 0
            sleep 2
          done
          docker logs s3
          exit 1
      - name: Системные пакеты для OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus ghostscript
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
